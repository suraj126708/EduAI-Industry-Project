<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFqMGdenJuKHrOpd8SJvioUCwi47M9erfzkw&s"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduAI</title>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"],
          ],
        },
        svg: {
          fontCache: "global",
        },
      };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
      mjx-container[display="true"] {
        display: block !important;
        overflow-x: auto;
        overflow-y: hidden;
        max-width: 100%;
      }

      /* 2. For inline math (like inside a question), force INLINE-BLOCK */
      mjx-container:not([display="true"]) {
        display: inline-block !important;
        vertical-align: middle; /* Keeps fractions aligned with text */
        margin: 0 2px;
      }
      mjx-container[jax="SVG"] {
        display: block !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
